services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: emberfall
      POSTGRES_DB: emberfall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs}
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emberfall -d emberfall"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports: ["127.0.0.1:9010:8333"]
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://emberfall:${POSTGRES_PASSWORD}@postgres:5432/emberfall
      S3_ENDPOINT: http://storage:8333
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  storage-data:

